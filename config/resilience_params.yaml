# =====================================================================
# CAHED resilience indicator system — calibrated parameters
# (paper Section 2.3 / Supporting Text S5; EXP13 v6.1 protocol)
# =====================================================================
# The five components (R1_bal, R1_stab, R2_prof, R2_stab, R3_wdf) are
# computed over trailing `window`-year windows and aggregated into the
# dimension indices R_S, R_I, R_W and the overall index R.  See
# script/resilience.py for the equations.

window: 5                # trailing-window length (years)

normalization:            # reference-based normalization parameters
  s_b: 0.30               # supply-demand alignment bandwidth (ln units)
  v_S: 0.07               # production-stability reference SD of d ln S
  m0: 0.10                # profitability logistic scale (margin units)
  v_I: 0.05               # margin-stability reference SD of m

water:
  WEI_M: 0.2              # WEI+ water-stress threshold M: a month is
                          # compliant when withdrawal <= M x available
  WA_SCALE: 1.0           # scaling of the climatological available
                          # water (185.2e8 m3/yr, 1987-2023 mean)

anchor_year: 2014         # calendar anchor for kappa_t and cost trend

protocol:                 # ensemble protocol of the paper figures
  start_year: 1985
  n_years: 61             # 1985-2045
  baseline:
    weather_seed: 2026
    market_seed: 7
  ensemble:
    n_members: 200
    weather_seed0: 3001   # member i weather seed = 3001 + i
    market_seed0: 1000    # member i market seed = 1000 + i
