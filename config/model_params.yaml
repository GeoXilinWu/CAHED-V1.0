# =====================================================================
# CAHED model parameters — calibrated defaults (Experiment 1, v1.4.0)
# =====================================================================
# All values reproduce the calibrated configuration reported in the
# manuscript (Sections 3.3 and 4.1).  Units are noted per parameter.
# Load with:  cfg = Config.from_yaml("config/model_params.yaml")
# ---------------------------------------------------------------------

# --- Simulation frame -------------------------------------------------
N: 30                 # simulation years
T_n: 365              # days per annual cycle
S_n: 4                # number of growth stages
seed: 2026            # random seed for reproducibility

# --- Soil parameters (Eqs. 2-6) ---------------------------------------
s_fc: 0.45            # field capacity (volumetric, m3/m3)
Ks: 35.0              # saturated hydraulic conductivity (mm/d)
omega: 4.5            # Clapp-Hornberger exponent, 2b + 3 (-)
porosity: 0.42        # soil porosity (m3/m3)

# --- Vegetation parameters --------------------------------------------
Zr: 200.0             # rooting depth (mm)
sw: 0.12              # wilting-point moisture (m3/m3)
s_star: 0.2690        # Feddes stress threshold s* (m3/m3); EXP2 v2
                      # calibrated (0.35 -> 0.2690, p05-p95 0.265-0.271)

# --- Yield -------------------------------------------------------------
# Updated 2026-09-26 (EXP2 v2): Y_max is the fixed BIOPHYSICAL ceiling
# (2400 kg/ha).  The observed technology trend is embedded in the model
# as Y_pot,t = Omega_t * Y_max with Omega_t = clip((tech_trend_intercept
# + tech_trend_slope * year) / Y_max, 0, 1) -- the OLS trend of observed
# Xinjiang lint yield 1987-2024 (+11.19 kg/ha/yr, R2 = 0.86) relative to
# Y_max; linear extrapolation continues until Omega = 1 (~2082), then
# Y_pot = Y_max.  Supersedes the EXP2 v1 two-period values (2338.8).
Y_max: 2400.0         # biophysical ceiling for lint yield (kg/ha)
tech_trend_enabled: true    # EXP2 v2 Omega_t technology path on/off
tech_trend_intercept: -20899.903788824322  # OLS yield trend at year 0 (kg/ha)
tech_trend_slope: 11.189372144764064       # OLS yield trend (kg/ha/yr)

# --- Vegetation: Feddes stress threshold — CALIBRATED ------------------
# Updated 2026-09-26 (EXP2 v2): 0.35 -> 0.2690 (behavioural p05-p95
# 0.265-0.271), from the KGE-based GLUE calibration on raw levels;
# coincides with the calibrated refill target (drip scheduling keeps
# the root zone at the onset of stress).
# NOTE: s_star stays in the vegetation block below; value updated there.

# --- Irrigation rule (Eq. 9) — CALIBRATED ------------------------------
# Updated 2026-09-26 (EXP2 v2, single set, no period split): s_irrig
# 0.228 -> 0.2075, s_target 0.411 -> 0.2686, from the KGE-based GLUE
# calibration (4000 LHS samples, 30 real-weather years, level-anchored,
# behavioural N = 63; KGE = 0.845 yield / 0.455 irrigation; behavioural
# p05-p95 0.204-0.209 / 0.261-0.272).  See EXP2_agro_hydro_cali/results/
# calibrated_parameters.yaml.
s_irrig: 0.2075       # irrigation trigger soil moisture (m3/m3)
s_target: 0.2686      # post-irrigation target moisture (m3/m3)
eta_irrig: 0.70       # irrigation application efficiency (-)
irrigate: true        # irrigation on/off

# --- Jensen stage sensitivities (Eq. 8) — CALIBRATED -------------------
# Updated 2026-09-26 (EXP2 v2): S2 0.23 -> 0.2082 (p05-p95 0.198-0.213),
# S3 0.60 -> 0.4301 (0.415-0.437); growth-late remains dominant.
jensen_lambdas:
  S2: 0.2082
  S3: 0.4301

# --- Demand (Eqs. 12-13) — CALIBRATED ----------------------------------
# eta is the EFFECTIVE price flexibility of regional supply in the
# integrated national market (not a textbook demand elasticity).
# Literature prior eta = -0.3 fails (NSE < 0); eta = -1.70 kept per
# EXP3 (not rejected) and EXP6 (purified SU-flexibility brackets it).
#
# Updated 2026-09-26 (EXP5 price correction, user instruction): kappa_0
# is now anchored to the SIMULATED total supply (A_sim x Y_sim on the
# deterministic 2014 trajectory) at the OBSERVED 2014 marketing-window
# price, removing the cross-module yield-basis mismatch (hydro module
# on the v2 water-dataset basis ~1.5 t/ha vs the old Y0_ref = 1.90 NBS
# anchor); g_d re-calibrated on the 2014-2023 CC Index Sep-Nov window:
# 6.5 %/yr -> 1.71 %/yr (Xinjiang share saturated >90 %), price RMSE
# 7,562 -> 2,216 CNY/t, PBIAS +46.1 % -> +2.0 % (eta = -1.70 fixed;
# eta = -2.3 would give RMSE 2,183 but is not adopted per EXP3/EXP6).
eta: -1.70            # effective price flexibility (-)
g_d: 0.0171           # demand-scale growth rate (1/yr); EXP5 calibration
kappa_anchor_supply: 2784241.4119569324  # simulated 2014 supply S=A*Y (t)
kappa_anchor_price: 15375.0              # observed CC Index Sep-Nov 2014

# --- Baseline calibration anchors (Eqs. 12-14) -------------------------
A0: 1884400.0         # baseline sown area, 2014 (ha)
P0: 18000.0           # baseline price, 2014 (CNY/t)
Y0_ref: 1.90          # reference lint yield (t/ha; NBS-confirmed)
C0: 32900.0           # unit production cost, 2014 base year (CNY/ha)

# --- Nerlove behavioural block (Eq. 14) — ESTIMATED --------------------
# OLS on the 2005-2023 Xinjiang panel (n = 17), speculative spike years
# 2010-2011 excluded, lagged price floored at the target price (P_eff,
# Eqs. 15-16): R2 = 0.88, DW = 1.86; in-sample NSE = 0.87;
# out-of-sample (expanding window) R2 = 0.34, MAPE = 7.2 %.
# (sup_v1 Table S9, model M1; EXP3_NEW, adopted 2026-09-29.)
b1: 0.875             # short-run price elasticity (p = 0.016;
                      #   95 % CI [0.19, 1.56])
b2: 0.752             # lagged-area coefficient (p = 0.0006;
                      #   partial adjustment = 1 - b2 = 0.248)
b3: -0.499            # cost coefficient (p = 0.098)
area_noise_sd: 0.086  # area-equation residual std (log units;
                      #   95 % CI [0.062, 0.139])
# b0 is derived ex post in Config (b0 = (1-b2) ln A0 - b1 ln P0
# = -4.99), matching the sup_v1 anchored value.

# --- Target-price policy (Eqs. 15-16) ----------------------------------
target_price:         # {calendar year: target price CNY/t};
  2014: 19800.0       #   years absent use tp_default
  2015: 19100.0
tp_default: 18600.0   # flat target price from 2016/17 onward (CNY/t)
Q_cap: null           # no subsidized-volume cap (V2 formulation,
                      # Eq. 15); set a tonnage to cap the subsidy

# --- Cost dynamics ------------------------------------------------------
# c_trend from the post-2013 Xinjiang cost series (the 2004-2023
# long-run trend of ~5.2 %/yr includes the pre-subsidy inflation
# phase and was rejected).
c_trend: 0.021        # unit-cost growth rate (1/yr)
c_cv: 0.02            # unit-cost lognormal volatility (-)

# --- Resilience settings (Section 2.3, Eqs. 19-21) ---------------------
resilience_window: 5  # moving-window length (years)
W_threshold: 12000000000.0  # annual available-water reference volume
                      # for WR (m3); distributed over growing-season
                      # months when no monthly series is supplied.
                      # Anchored to Li et al. (2023) blue-water
                      # footprint ~14.5e9 m3; +-25 % sensitivity
                      # recommended
wei_threshold: 0.2    # WEI+ water-stress threshold M (Eq. 21): a
                      # growing-season month is compliant when
                      # irrigation withdrawal <= 0.2 x available water
